name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      # 20 is the engines floor; 22 is what the runners actually want. Testing
      # both keeps the floor honest rather than aspirational.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Reference docs drift silently — nothing breaks, they just quietly stop
      # being true. This checks that links resolve and that everything the code
      # enumerates is documented somewhere.
      - name: Check documentation
        run: npm run check:docs

      # The runner overlay is a template, not valid JSON on its own. A broken
      # one means no park loop and no merge gate, so it is checked here rather
      # than discovered at the first spawn.
      - name: Validate the hook overlay template
        run: |
          node -e "
            const fs = require('fs');
            const rendered = fs.readFileSync('runner/settings.json', 'utf8')
              .replace(/\\\$\{PARK_TIMEOUT_S\}/g, '540')
              .replace(/\\\$\{[A-Z_]+\}/g, 'placeholder');
            const parsed = JSON.parse(rendered);
            const events = Object.keys(parsed.hooks);
            for (const required of ['Stop', 'PreToolUse', 'PostToolUse', 'SessionStart', 'SessionEnd']) {
              if (!events.includes(required)) throw new Error('missing hook event: ' + required);
            }
            console.log('hook overlay renders and covers', events.length, 'events');
          "

      - name: Validate the example repo config
        run: |
          node -e "
            const { parse } = require('yaml');
            const fs = require('fs');
            for (const f of ['.github/gquay.yml', 'router.example.yml']) {
              parse(fs.readFileSync(f, 'utf8'));
              console.log(f, 'parses');
            }
          "

      - name: Check the shell scripts
        run: |
          for f in setup.sh scripts/*.sh scripts/setup/*.sh runner/hooks/*.sh; do
            bash -n "$f" || exit 1
          done
          # The front door must at least be able to describe itself.
          ./setup.sh --list > /dev/null

      - name: Check shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced lib.sh is resolved at runtime, not by the linter.
          shellcheck -e SC1091 setup.sh scripts/*.sh scripts/setup/*.sh runner/hooks/*.sh
