# Respond to @claude on issues and pull requests.
#
# This is the smallest useful thing: no server, no public URL, no database.
# GitHub runs a container per event, Claude works in it, pushes a branch, opens
# a PR, and the container is destroyed.
#
# Copy to .github/workflows/claude.yml in the repository you want it on.
#
# Setup:
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Add a repository secret. For a Claude subscription:
#        claude setup-token          # prints a one-year token
#        gh secret set CLAUDE_CODE_OAUTH_TOKEN
#      Or for Console billing, set ANTHROPIC_API_KEY and swap the input below.
#   3. Commit this file. Then comment "@claude implement this" on any issue.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Also fires on a newly opened issue whose title or body mentions @claude.
  issues:
    types: [opened]

jobs:
  claude:
    # Cheap pre-filter so runners don't start on every comment. The action
    # checks the trigger phrase itself too — this just avoids paying for it.
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write        # push the branch
      pull-requests: write   # open the PR
      issues: write          # comment back on the thread
      id-token: write        # required for the action's GitHub App auth
      actions: read          # read CI results on PRs

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth. For Console billing use:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # No `prompt` input, so the action runs in interactive mode: it waits
          # for @claude and answers that request. Add a `prompt` to make it run
          # unprompted on any event instead.

          claude_args: |
            --max-turns 30

      # Deliberately NOT passing `github_token: ${{ secrets.GITHUB_TOKEN }}`.
      # GitHub does not trigger workflows on commits made with the default
      # GITHUB_TOKEN, so CI would never run on Claude's own pushes. Leaving it
      # out makes the action authenticate as the Claude GitHub App instead.
